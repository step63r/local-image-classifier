<form method="get" action="/" class="flex flex-col">
  <div class="flex items-center gap-2 {{ 'h-14' if show_chrome else 'mt-2' }}">
    <div class="relative min-w-0 flex-1">
      <!-- text-base (16px): iOS Safariはフォーカス時のfont-sizeが16px未満だと
           ページ全体を自動ズームしてしまうため、text-smより小さくしない。 -->
      <input type="text" name="q" id="searchInput" value="{{ q }}"
        placeholder="キーワードを入力"
        class="w-full rounded border border-neutral-700 bg-neutral-900 px-3 py-2 pr-10 text-base sm:text-sm">
      <button type="submit" id="searchSubmitBtn" aria-label="検索"
        class="absolute inset-y-0 right-0 flex items-center px-3 text-neutral-400 hover:text-neutral-200 disabled:cursor-not-allowed disabled:opacity-40">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
          stroke="currentColor" class="h-5 w-5">
          <path stroke-linecap="round" stroke-linejoin="round"
            d="m21 21-5.197-5.197m0 0A7.5 7.5 0 1 0 5.196 5.196a7.5 7.5 0 0 0 10.607 10.607Z" />
        </svg>
      </button>
    </div>
    {% if show_save_star %}
    {% include "_save_star.html" %}
    {% endif %}
    {% if show_chrome %}
    <button type="button" id="menuBtn" aria-label="メニュー"
      class="shrink-0 px-2 text-neutral-400 hover:text-neutral-200 lg:hidden">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
        stroke="currentColor" class="h-5 w-5">
        <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5" />
      </svg>
    </button>
    {% endif %}
  </div>
  <div class="flex flex-col gap-2 {{ 'pb-3' if show_chrome else 'mt-2' }}">
    <button type="button"
      onclick="var p=document.getElementById('filters-panel'); p.classList.toggle('hidden'); p.classList.toggle('flex');"
      class="self-start text-xs text-neutral-400 underline hover:text-neutral-200">
      詳細
    </button>
    <div id="filters-panel" class="hidden flex-col gap-3 sm:flex-row sm:flex-wrap sm:items-center sm:gap-4">
      <input type="text" name="folder" value="{{ folder }}"
        placeholder="フォルダで絞り込み"
        class="w-full rounded border border-neutral-700 bg-neutral-900 px-3 py-2 text-base sm:w-56 sm:text-sm">
      <select name="sort"
        class="w-full rounded border border-neutral-700 bg-neutral-900 px-3 py-2 text-base sm:w-56 sm:text-sm">
        <option value="relevance_desc" {{ 'selected' if sort == 'relevance_desc' else '' }}>関連度が高い順</option>
        <option value="relevance_asc" {{ 'selected' if sort == 'relevance_asc' else '' }}>関連度が低い順</option>
        <option value="tagged_at_desc" {{ 'selected' if sort == 'tagged_at_desc' else '' }}>タグ付け日時が新しい順</option>
      </select>
      <div class="flex flex-col gap-1 text-xs text-neutral-400 sm:w-48">
        <div class="flex items-center justify-between">
          <span>general</span>
          <span class="tabular-nums text-neutral-500" data-range-value>{{ "%.2f"|format(gt_min) }} ~ {{ "%.2f"|format(gt_max) }}</span>
        </div>
        <div class="range-slider relative h-4" data-range-slider>
          <div class="absolute inset-x-0 top-1/2 h-1 -translate-y-1/2 rounded bg-neutral-700"></div>
          <div class="absolute top-1/2 h-1 -translate-y-1/2 rounded bg-sky-500" data-range-fill></div>
          <input type="range" name="gt_min" value="{{ gt_min }}" min="0" max="1" step="0.05"
            class="range-slider-input" data-range-min>
          <input type="range" name="gt_max" value="{{ gt_max }}" min="0" max="1" step="0.05"
            class="range-slider-input" data-range-max>
        </div>
      </div>
      <div class="flex flex-col gap-1 text-xs text-neutral-400 sm:w-48">
        <div class="flex items-center justify-between">
          <span>character</span>
          <span class="tabular-nums text-neutral-500" data-range-value>{{ "%.2f"|format(ct_min) }} ~ {{ "%.2f"|format(ct_max) }}</span>
        </div>
        <div class="range-slider relative h-4" data-range-slider>
          <div class="absolute inset-x-0 top-1/2 h-1 -translate-y-1/2 rounded bg-neutral-700"></div>
          <div class="absolute top-1/2 h-1 -translate-y-1/2 rounded bg-sky-500" data-range-fill></div>
          <input type="range" name="ct_min" value="{{ ct_min }}" min="0" max="1" step="0.05"
            class="range-slider-input" data-range-min>
          <input type="range" name="ct_max" value="{{ ct_max }}" min="0" max="1" step="0.05"
            class="range-slider-input" data-range-max>
        </div>
      </div>
      <label class="flex items-center gap-1 text-xs text-neutral-400">
        <input type="checkbox" name="exclude_sensitive" value="1" {{ 'checked' if exclude_sensitive else '' }}
          class="rounded border-neutral-700 bg-neutral-900">
        <!-- Unchecked checkboxes submit nothing at all, so a plain "0"
             fallback would be indistinguishable from a fresh page load
             (no exclude_sensitive param at all). Placed after the
             checkbox so that when checked, its "1" wins as the first
             value Flask sees for this name. -->
        <input type="hidden" name="exclude_sensitive" value="0">
        exclude sensitive
      </label>
    </div>
  </div>
</form>

<script>
  (function () {
    // 関連度ソートは検索語が無いと計算できないため、空文字での検索は送信自体を
    // させない(エラー表示は出さず、ボタンを無効化するだけに留める -- 仕様判断)。
    var input = document.getElementById('searchInput');
    var submitBtn = document.getElementById('searchSubmitBtn');
    if (!input || !submitBtn) return;

    function updateState() {
      submitBtn.disabled = input.value.trim() === '';
    }

    input.addEventListener('input', updateState);
    updateState();

    var form = input.closest('form');
    form.addEventListener('submit', function (e) {
      if (input.value.trim() === '') {
        e.preventDefault();
      }
    });
  })();
</script>

<script>
  (function () {
    document.querySelectorAll('[data-range-slider]').forEach(function (slider) {
      var minInput = slider.querySelector('[data-range-min]');
      var maxInput = slider.querySelector('[data-range-max]');
      var fill = slider.querySelector('[data-range-fill]');
      var display = slider.parentElement.querySelector('[data-range-value]');

      function update(movedInput) {
        var min = parseFloat(minInput.value);
        var max = parseFloat(maxInput.value);
        if (min > max) {
          if (movedInput === maxInput) {
            min = max;
            minInput.value = min;
          } else {
            max = min;
            maxInput.value = max;
          }
        }
        fill.style.left = (min * 100) + '%';
        fill.style.width = ((max - min) * 100) + '%';
        if (display) {
          display.textContent = min.toFixed(2) + ' ~ ' + max.toFixed(2);
        }
      }

      function bringToFront(el, other) {
        el.style.zIndex = 5;
        other.style.zIndex = 3;
      }

      minInput.addEventListener('pointerdown', function () { bringToFront(minInput, maxInput); });
      maxInput.addEventListener('pointerdown', function () { bringToFront(maxInput, minInput); });
      minInput.addEventListener('input', function () { update(minInput); });
      maxInput.addEventListener('input', function () { update(maxInput); });
      update();
    });
  })();
</script>
