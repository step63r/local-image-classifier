<form method="get" action="/" class="flex flex-col">
  <div class="flex items-center gap-2 {{ 'h-14' if show_chrome else 'mt-2' }}">
    {% if show_chrome %}
    <a href="#" id="backLink" aria-label="戻る"
      class="hidden shrink-0 text-neutral-400 hover:text-neutral-200">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
        stroke="currentColor" class="h-5 w-5">
        <path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5 3 12m0 0 7.5-7.5M3 12h18" />
      </svg>
    </a>
    {% endif %}
    <div class="relative min-w-0 flex-1">
      <!-- text-base (16px): iOS Safariはフォーカス時のfont-sizeが16px未満だと
           ページ全体を自動ズームしてしまうため、text-smより小さくしない。 -->
      <input type="text" name="q" value="{{ q }}"
        placeholder="キーワードを入力"
        class="w-full rounded border border-neutral-700 bg-neutral-900 px-3 py-2 pr-10 text-base sm:text-sm">
      <button type="submit" aria-label="検索"
        class="absolute inset-y-0 right-0 flex items-center px-3 text-neutral-400 hover:text-neutral-200">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
          stroke="currentColor" class="h-5 w-5">
          <path stroke-linecap="round" stroke-linejoin="round"
            d="m21 21-5.197-5.197m0 0A7.5 7.5 0 1 0 5.196 5.196a7.5 7.5 0 0 0 10.607 10.607Z" />
        </svg>
      </button>
    </div>
    {% if show_save_star %}
    {% include "_save_star.html" %}
    {% endif %}
    {% if show_chrome %}
    <button type="button" id="menuBtn" aria-label="メニュー"
      class="shrink-0 text-neutral-400 hover:text-neutral-200">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
        stroke="currentColor" class="h-5 w-5">
        <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5" />
      </svg>
    </button>
    {% endif %}
  </div>
  <div class="flex flex-col gap-2 {{ 'pb-3' if show_chrome else 'mt-2' }}">
    <button type="button"
      onclick="var p=document.getElementById('filters-panel'); p.classList.toggle('hidden'); p.classList.toggle('flex');"
      class="self-start text-xs text-neutral-400 underline hover:text-neutral-200">
      詳細
    </button>
    <div id="filters-panel" class="hidden flex-col gap-3 sm:flex-row sm:flex-wrap sm:items-center sm:gap-4">
      <input type="text" name="folder" value="{{ folder }}"
        placeholder="フォルダで絞り込み"
        class="w-full rounded border border-neutral-700 bg-neutral-900 px-3 py-2 text-base sm:w-56 sm:text-sm">
      <div class="flex flex-wrap items-center gap-1 text-xs text-neutral-400">
        <span>general</span>
        <input type="number" name="gt_min" value="{{ gt_min }}" step="0.05" min="0" max="1"
          class="w-16 rounded border border-neutral-700 bg-neutral-900 px-1 py-1 text-base sm:text-xs">
        <span>~</span>
        <input type="number" name="gt_max" value="{{ gt_max }}" step="0.05" min="0" max="1"
          class="w-16 rounded border border-neutral-700 bg-neutral-900 px-1 py-1 text-base sm:text-xs">
      </div>
      <div class="flex flex-wrap items-center gap-1 text-xs text-neutral-400">
        <span>character</span>
        <input type="number" name="ct_min" value="{{ ct_min }}" step="0.05" min="0" max="1"
          class="w-16 rounded border border-neutral-700 bg-neutral-900 px-1 py-1 text-base sm:text-xs">
        <span>~</span>
        <input type="number" name="ct_max" value="{{ ct_max }}" step="0.05" min="0" max="1"
          class="w-16 rounded border border-neutral-700 bg-neutral-900 px-1 py-1 text-base sm:text-xs">
      </div>
      <label class="flex items-center gap-1 text-xs text-neutral-400">
        <input type="checkbox" name="exclude_sensitive" value="1" {{ 'checked' if exclude_sensitive else '' }}
          class="rounded border-neutral-700 bg-neutral-900">
        <!-- Unchecked checkboxes submit nothing at all, so a plain "0"
             fallback would be indistinguishable from a fresh page load
             (no exclude_sensitive param at all). Placed after the
             checkbox so that when checked, its "1" wins as the first
             value Flask sees for this name. -->
        <input type="hidden" name="exclude_sensitive" value="0">
        exclude sensitive
      </label>
    </div>
  </div>
</form>

{% if show_chrome %}
<script>
  (function () {
    var backLink = document.getElementById('backLink');
    if (backLink && document.referrer) {
      try {
        if (new URL(document.referrer).origin === window.location.origin) {
          backLink.classList.remove('hidden');
          backLink.addEventListener('click', function (e) {
            e.preventDefault();
            history.back();
          });
        }
      } catch (e) {}
    }
  })();
</script>
{% endif %}
