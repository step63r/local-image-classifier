{% for img in images %}
<a href="/detail/{{ img['id'] }}?{{ detail_qs }}"
   class="img-skeleton block aspect-square overflow-hidden rounded-lg">
  <img src="/thumb/{{ img['id'] }}" loading="lazy" class="thumb h-full w-full object-cover" alt=""
       onload="this.classList.add('loaded')" onerror="this.classList.add('loaded')">
</a>
{% endfor %}

{% if has_next %}
<div
  hx-get="{{ next_url }}"
  hx-trigger="revealed"
  hx-swap="outerHTML"
  class="col-span-full py-6 text-center text-sm text-neutral-500"
>
  読み込み中...
</div>
{% endif %}
