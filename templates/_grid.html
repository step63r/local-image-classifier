{% for img in images %}
<a href="/detail/{{ img['id'] }}?q={{ q | urlencode }}&folder={{ folder | urlencode }}&page={{ page }}&gt={{ gt }}&ct={{ ct }}"
   class="block aspect-square overflow-hidden rounded-lg bg-neutral-800">
  <img src="/thumb/{{ img['id'] }}" loading="lazy" class="h-full w-full object-cover" alt="">
</a>
{% endfor %}

{% if has_next %}
<div
  hx-get="{{ next_url }}"
  hx-trigger="revealed"
  hx-swap="outerHTML"
  class="col-span-full py-6 text-center text-sm text-neutral-500"
>
  読み込み中...
</div>
{% endif %}
