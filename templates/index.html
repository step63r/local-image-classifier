<!DOCTYPE html>
<html lang="ja" class="h-full">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Image Tag Search</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/htmx.org@1.9.12"></script>
<style>
  @keyframes img-shimmer {
    0% { background-position: -400px 0; }
    100% { background-position: 400px 0; }
  }
  .img-skeleton {
    background-color: #262626;
    background-image: linear-gradient(90deg, rgba(255,255,255,0) 0, rgba(255,255,255,0.06) 20%, rgba(255,255,255,0.14) 60%, rgba(255,255,255,0));
    background-size: 400px 100%;
    background-repeat: no-repeat;
    animation: img-shimmer 1.4s infinite linear;
  }
  .thumb {
    opacity: 0;
    transition: opacity 0.25s ease;
  }
  .thumb.loaded {
    opacity: 1;
  }
</style>
</head>
<body class="min-h-full bg-neutral-950 text-neutral-100">
  <header class="sticky top-0 z-10 border-b border-neutral-800 bg-neutral-950/90 backdrop-blur">
    <div class="mx-auto max-w-6xl px-4 py-2 sm:py-3">
      <div class="flex items-center justify-between gap-2 sm:mb-2">
        <h1 class="text-base font-semibold sm:text-lg">Image Tag Search</h1>
        <p class="text-xs text-neutral-500">{{ total }} 件</p>
      </div>
      <form method="get" action="/" class="mt-2 flex flex-col gap-2">
        <div class="flex gap-2">
          <input type="text" name="q" value="{{ q }}"
            placeholder='タグをスペース区切りでAND検索 (部分一致OK、"完全一致"は引用符で囲む)'
            class="w-full rounded border border-neutral-700 bg-neutral-900 px-3 py-2 text-sm">
          <button type="submit" class="shrink-0 rounded bg-sky-600 px-4 py-2 text-sm font-medium hover:bg-sky-500">
            検索
          </button>
          <button type="button"
            onclick="var p=document.getElementById('filters-panel'); p.classList.toggle('hidden'); p.classList.toggle('flex');"
            class="shrink-0 rounded border border-neutral-700 px-3 py-2 text-sm text-neutral-300">
            詳細
          </button>
        </div>
        <div id="filters-panel" class="hidden flex-col gap-3 sm:flex-row sm:flex-wrap sm:items-center sm:gap-4">
          <input type="text" name="folder" value="{{ folder }}"
            placeholder="フォルダで絞り込み"
            class="w-full rounded border border-neutral-700 bg-neutral-900 px-3 py-2 text-sm sm:w-56">
          <div class="flex flex-wrap items-center gap-1 text-xs text-neutral-400">
            <span>general</span>
            <input type="number" name="gt_min" value="{{ gt_min }}" step="0.05" min="0" max="1"
              class="w-16 rounded border border-neutral-700 bg-neutral-900 px-1 py-1">
            <span>~</span>
            <input type="number" name="gt_max" value="{{ gt_max }}" step="0.05" min="0" max="1"
              class="w-16 rounded border border-neutral-700 bg-neutral-900 px-1 py-1">
          </div>
          <div class="flex flex-wrap items-center gap-1 text-xs text-neutral-400">
            <span>character</span>
            <input type="number" name="ct_min" value="{{ ct_min }}" step="0.05" min="0" max="1"
              class="w-16 rounded border border-neutral-700 bg-neutral-900 px-1 py-1">
            <span>~</span>
            <input type="number" name="ct_max" value="{{ ct_max }}" step="0.05" min="0" max="1"
              class="w-16 rounded border border-neutral-700 bg-neutral-900 px-1 py-1">
          </div>
          <label class="flex items-center gap-1 text-xs text-neutral-400">
            <input type="checkbox" name="exclude_sensitive" value="1" {{ 'checked' if exclude_sensitive else '' }}
              class="rounded border-neutral-700 bg-neutral-900">
            exclude sensitive
          </label>
        </div>
      </form>
    </div>
  </header>

  <main class="mx-auto max-w-6xl px-4 py-4">
    <div id="grid" class="grid grid-cols-2 gap-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6">
      {% include "_grid.html" %}
    </div>
  </main>
</body>
</html>
