<!DOCTYPE html>
<html lang="ja" class="h-full">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Image Tag Search</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/htmx.org@1.9.12"></script>
<style>
  @keyframes img-shimmer {
    0% { background-position: -400px 0; }
    100% { background-position: 400px 0; }
  }
  .img-skeleton {
    background-color: #262626;
    background-image: linear-gradient(90deg, rgba(255,255,255,0) 0, rgba(255,255,255,0.06) 20%, rgba(255,255,255,0.14) 60%, rgba(255,255,255,0));
    background-size: 400px 100%;
    background-repeat: no-repeat;
    animation: img-shimmer 1.4s infinite linear;
  }
  .thumb {
    opacity: 0;
    transition: opacity 0.25s ease;
  }
  .thumb.loaded {
    opacity: 1;
  }
</style>
</head>
<body class="min-h-full bg-neutral-950 text-neutral-100">
  {% if has_searched %}
  <header class="sticky top-0 z-10 border-b border-neutral-800 bg-neutral-950/90 backdrop-blur">
    <div class="mx-auto max-w-6xl px-4 py-2 sm:py-3">
      <div class="flex items-center justify-between gap-2 sm:mb-2">
        <h1 class="text-base font-semibold sm:text-lg">
          <a href="/" class="hover:underline">Image Tag Search</a>
        </h1>
        <div class="flex items-center gap-3">
          <p class="text-xs text-neutral-500">{{ total }} 件</p>
          <a href="/logout" class="text-xs text-neutral-500 hover:underline">ログアウト</a>
        </div>
      </div>
      {% include "_search_form.html" %}
    </div>
  </header>

  <main class="mx-auto max-w-6xl px-4 py-4">
    <div id="grid" class="grid grid-cols-2 gap-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6">
      {% include "_grid.html" %}
    </div>
  </main>
  {% else %}
  <div class="flex min-h-screen flex-col items-center justify-center px-4">
    <h1 class="mb-8 text-2xl font-semibold sm:text-3xl">Image Tag Search</h1>
    <div class="w-full max-w-2xl">
      {% include "_search_form.html" %}
    </div>
    <a href="/logout" class="mt-6 text-xs text-neutral-500 hover:underline">ログアウト</a>
  </div>
  {% endif %}
</body>
</html>
