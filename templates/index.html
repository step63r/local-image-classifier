<!DOCTYPE html>
<html lang="ja" class="h-full">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Image Tag Search</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/htmx.org@1.9.12"></script>
</head>
<body class="min-h-full bg-neutral-950 text-neutral-100">
  <header class="sticky top-0 z-10 border-b border-neutral-800 bg-neutral-950/90 backdrop-blur">
    <div class="mx-auto max-w-6xl px-4 py-3">
      <h1 class="mb-2 text-lg font-semibold">Image Tag Search</h1>
      <form method="get" action="/" class="flex flex-col gap-2 sm:flex-row sm:flex-wrap sm:items-center">
        <input type="text" name="q" value="{{ q }}"
          placeholder="タグをスペース区切りでAND検索 (部分一致OK)"
          class="w-full rounded border border-neutral-700 bg-neutral-900 px-3 py-2 text-sm sm:w-72">
        <input type="text" name="folder" value="{{ folder }}"
          placeholder="フォルダで絞り込み"
          class="w-full rounded border border-neutral-700 bg-neutral-900 px-3 py-2 text-sm sm:w-56">
        <div class="flex items-center gap-3 text-xs text-neutral-400">
          <label class="flex items-center gap-1">general
            <input type="number" name="gt" value="{{ gt }}" step="0.05" min="0" max="1"
              class="w-16 rounded border border-neutral-700 bg-neutral-900 px-1 py-1">
          </label>
          <label class="flex items-center gap-1">character
            <input type="number" name="ct" value="{{ ct }}" step="0.05" min="0" max="1"
              class="w-16 rounded border border-neutral-700 bg-neutral-900 px-1 py-1">
          </label>
        </div>
        <button type="submit" class="rounded bg-sky-600 px-4 py-2 text-sm font-medium hover:bg-sky-500">
          検索
        </button>
      </form>
      <p class="mt-1 text-xs text-neutral-500">{{ total }} 件</p>
    </div>
  </header>

  <main class="mx-auto max-w-6xl px-4 py-4">
    <div id="grid" class="grid grid-cols-2 gap-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6">
      {% include "_grid.html" %}
    </div>
  </main>
</body>
</html>
