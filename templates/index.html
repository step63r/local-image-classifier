<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Image Tag Search</title>
<style>
  body { font-family: sans-serif; margin: 1.5rem; background: #111; color: #eee; }
  form { margin-bottom: 1rem; }
  input[type=text] { padding: 0.4rem; font-size: 1rem; }
  input[name=q] { width: 22rem; }
  input[name=folder] { width: 18rem; }
  button { padding: 0.4rem 0.8rem; font-size: 1rem; }
  .meta { color: #999; margin-bottom: 1rem; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 8px; }
  .grid a { display: block; }
  .grid img { width: 100%; height: 160px; object-fit: cover; border-radius: 4px; background: #222; }
  .pager { margin-top: 1.5rem; display: flex; gap: 1rem; }
  .pager a { color: #6cf; }
  .row { display: flex; gap: 0.5rem; align-items: center; flex-wrap: wrap; margin-bottom: 0.5rem; }
  .thresholds { display: flex; gap: 1rem; align-items: center; margin-bottom: 0.5rem; color: #ccc; font-size: 0.9rem; }
  .thresholds input[type=number] { width: 5rem; padding: 0.2rem; }
</style>
</head>
<body>
  <h1>Image Tag Search</h1>
  <form method="get" action="/">
    <div class="row">
      <input type="text" name="q" value="{{ q }}" placeholder="タグをスペース区切りでAND検索 (部分一致: honolulu でもOK)">
      <input type="text" name="folder" value="{{ folder }}" placeholder="フォルダで絞り込み (パスの部分一致: 306_バーチャルYouTuber など)">
      <button type="submit">検索</button>
    </div>
    <div class="thresholds">
      <label>general閾値 <input type="number" name="gt" value="{{ gt }}" step="0.05" min="0" max="1"></label>
      <label>character閾値 <input type="number" name="ct" value="{{ ct }}" step="0.05" min="0" max="1"></label>
    </div>
  </form>
  <div class="meta">{{ total }} 件 (ページ {{ page }})</div>

  <div class="grid">
    {% for img in images %}
    <a href="/detail/{{ img['id'] }}?q={{ q | urlencode }}&folder={{ folder | urlencode }}&page={{ page }}&gt={{ gt }}&ct={{ ct }}">
      <img src="/image/{{ img['id'] }}" loading="lazy" alt="">
    </a>
    {% endfor %}
  </div>

  <div class="pager">
    {% if has_prev %}<a href="/?q={{ q | urlencode }}&folder={{ folder | urlencode }}&gt={{ gt }}&ct={{ ct }}&page={{ page - 1 }}">← 前へ</a>{% endif %}
    {% if has_next %}<a href="/?q={{ q | urlencode }}&folder={{ folder | urlencode }}&gt={{ gt }}&ct={{ ct }}&page={{ page + 1 }}">次へ →</a>{% endif %}
  </div>
</body>
</html>
