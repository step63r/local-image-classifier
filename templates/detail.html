<!DOCTYPE html>
<html lang="ja" class="h-full">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Image Detail</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  /* 横長画像で説明欄が全体幅の1/3未満になる場合、モバイルと同様に縦積みに強制する */
  #detailRow.force-stack { flex-direction: column !important; }
  #detailRow.force-stack #detailImg { width: 100% !important; }

  @keyframes img-shimmer {
    0% { background-position: -400px 0; }
    100% { background-position: 400px 0; }
  }
  #detailImgWrap {
    background-color: #262626;
    background-image: linear-gradient(90deg, rgba(255,255,255,0) 0, rgba(255,255,255,0.06) 20%, rgba(255,255,255,0.14) 60%, rgba(255,255,255,0));
    background-size: 400px 100%;
    background-repeat: no-repeat;
    animation: img-shimmer 1.4s infinite linear;
    border-radius: 0.5rem;
    min-height: 40vh;
  }
  @media (min-width: 768px) {
    #detailImgWrap { min-width: 40vw; }
  }
  #detailImgWrap.loaded {
    background: none;
    animation: none;
    min-height: 0;
    min-width: 0;
  }
  #detailImg {
    opacity: 0;
    transition: opacity 0.25s ease;
  }
  #detailImg.loaded {
    opacity: 1;
  }
</style>
</head>
<body class="min-h-full bg-neutral-950 text-neutral-100">
  <div class="mx-auto max-w-5xl px-4 py-4">
    <a href="{{ back_url }}" class="text-sm text-sky-400 hover:underline">&larr; 検索に戻る</a>

    <div id="detailRow" class="mt-4 flex flex-col gap-4 md:flex-row">
      <div id="detailImgWrap" class="w-full md:w-auto">
        <img id="detailImg" src="/image/{{ image['id'] }}" alt=""
          class="max-h-[80vh] w-full rounded-lg object-contain md:w-auto"
          onload="this.classList.add('loaded'); this.parentElement.classList.add('loaded')"
          onerror="this.classList.add('loaded'); this.parentElement.classList.add('loaded')">
      </div>

      <div class="min-w-0 flex-1">
        <p class="mb-2 break-all text-xs text-neutral-400">{{ image['path'] }}</p>
        <p class="mb-3 text-xs text-neutral-500">
          薄いタグ = 現在の範囲(general {{ gt_min }}〜{{ gt_max }} / character {{ ct_min }}〜{{ ct_max }})外(保存はされているが検索対象外)
        </p>
        <table class="w-full text-sm">
          {% for t in tags %}
          <tr class="border-b border-neutral-800 {{ '' if passes(t) else 'opacity-30' }}">
            <td class="py-1 pr-3 {{
              'text-pink-400' if t['category'] == 'character'
              else ('text-amber-400' if t['category'] == 'rating' else '')
            }}"><a href="{{ tag_url(t['tag']) }}" class="hover:underline">{{ t['tag'] }}</a></td>
            <td class="py-1 pr-3 text-neutral-500">{{ t['category'] }}</td>
            <td class="py-1 text-neutral-400">{{ "%.3f"|format(t['confidence']) }}</td>
          </tr>
          {% endfor %}
        </table>
      </div>
    </div>
  </div>

  <script>
    (function () {
      var row = document.getElementById('detailRow');
      var img = document.getElementById('detailImg');
      var GAP_PX = 16; // gap-4

      function updateLayout() {
        if (!window.matchMedia('(min-width: 768px)').matches) {
          row.classList.remove('force-stack');
          return;
        }
        if (!img.naturalWidth || !img.naturalHeight) return;

        var rowWidth = row.clientWidth;
        var maxHeightPx = window.innerHeight * 0.8; // max-h-[80vh]
        var ratio = img.naturalWidth / img.naturalHeight;
        var imgWidth = Math.min(ratio * maxHeightPx, rowWidth);
        var descWidth = rowWidth - imgWidth - GAP_PX;

        row.classList.toggle('force-stack', descWidth < rowWidth / 3);
      }

      var scheduled = false;
      function scheduleUpdate() {
        if (scheduled) return;
        scheduled = true;
        requestAnimationFrame(function () {
          scheduled = false;
          updateLayout();
        });
      }

      img.addEventListener('load', updateLayout);
      window.addEventListener('resize', scheduleUpdate);
      if (img.complete) {
        updateLayout();
        img.classList.add('loaded');
        img.parentElement.classList.add('loaded');
      }
    })();
  </script>
</body>
</html>
